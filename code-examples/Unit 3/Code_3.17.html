
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unit 3:Bootstrap Carousel Example</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

    <div class="container my-5">
        <h1 class="text-center mb-4">Featured Content</h1>

        <!-- Bootstrap Carousel -->
        <div id="featuredCarousel" class="carousel slide">

            <div class="carousel-inner">

                <!-- First Slide -->
                <div class="carousel-item active">
                    <img
                        src="learning.jpg"
                        class="d-block w-100"
                        alt="First featured image">

                    <div class="carousel-caption d-none d-md-block">
                        <h5>First Slide</h5>
                        <p>Introduction to the featured content.</p>
                    </div>
                </div>

                <!-- Second Slide -->
                <div class="carousel-item">
                    <img
                        src="learning1.jpg"
                        class="d-block w-100"
                        alt="Second featured image">

                    <div class="carousel-caption d-none d-md-block">
                        <h5>Second Slide</h5>
                        <p>Explore more featured content.</p>
                    </div>
                </div>
				
				<!-- Third Slide -->
                <div class="carousel-item">
                    <img
                        src="learning2.jpg"
                        class="d-block w-100"
                        alt="Second featured image">

                    <div class="carousel-caption d-none d-md-block">
                        <h5>Third Slide</h5>
                        <p>Explore more featured content.</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#featuredCarousel"
                data-bs-slide="prev">

                <span
                    class="carousel-control-prev-icon"
                    aria-hidden="true"></span>

                <span class="visually-hidden">Previous</span>
            </button>

            <!-- Next Button -->
            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#featuredCarousel"
                data-bs-slide="next">

                <span
                    class="carousel-control-next-icon"
                    aria-hidden="true"></span>

                <span class="visually-hidden">Next</span>
            </button>

        </div>
    </div>

    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
